<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Dumbbell -->
  <!-- Left outer plate -->
  <rect x="6"  y="23" width="8" height="18" rx="3" fill="white" opacity="0.95"/>
  <!-- Left inner plate -->
  <rect x="14" y="26" width="5" height="12" rx="2" fill="white" opacity="0.75"/>
  <!-- Bar -->
  <rect x="19" y="30" width="26" height="4"  rx="2" fill="white" opacity="0.95"/>
  <!-- Right inner plate -->
  <rect x="45" y="26" width="5" height="12" rx="2" fill="white" opacity="0.75"/>
  <!-- Right outer plate -->
  <rect x="50" y="23" width="8" height="18" rx="3" fill="white" opacity="0.95"/>
</svg>
